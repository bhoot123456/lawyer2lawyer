name: CI Regression Gate

# Always-on regression gate. Mirrors the local verification gate documented
# in app/README.md. No security settings are weakened for CI: the workflow
# runs the backend in development mode (NODE_ENV unset) against a disposable
# MongoDB service container with CI-only throwaway secrets.

on:
  push:
  pull_request:

jobs:
  gate:
    name: Backend + Mobile regression gate
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URI: mongodb://127.0.0.1:27017/lawyer2lawyer-ci
      PORT: "5000"
      # CI-only throwaway secrets (never used in production).
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-only-jwt-refresh-secret-0123456789abcdef

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            mobile/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # ── Step 1: unit/authorization test suite ──
      - name: Backend unit tests (npm test)
        working-directory: backend
        run: npm test

      # ── Boot backend against the MongoDB service container ──
      - name: Start backend server
        working-directory: backend
        run: |
          node index.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:5000/api/states; then
              echo "Backend is up after ${i} attempt(s)."
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start:"; cat server.log
          exit 1

      # The CMS smoke test requires a super admin; seed a disposable one.
      - name: Seed CI super admin
        working-directory: backend
        run: node scripts/create-super-admin.js ci-admin@l2l-test.local --password=CiOnly!SmokePass2026

      # ── Step 2: CMS smoke test ──
      - name: CMS smoke test (test:smoke)
        working-directory: backend
        run: npm run test:smoke

      # ── Step 3: anonymous Cases contract ──
      - name: Anonymous cases smoke test (test:cases)
        working-directory: backend
        run: npm run test:cases

      # ── Step 4: authenticated Cases contract ──
      - name: Authenticated cases smoke test (test:cases:auth)
        working-directory: backend
        run: npm run test:cases:auth

      # ── Step 5: mobile type-check + lint (warnings allowed, errors fail) ──
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Mobile TypeScript check (tsc --noEmit)
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Mobile ESLint (errors fail, warnings allowed)
        working-directory: mobile
        run: npx eslint src

      - name: Print backend server log (always, for diagnostics)
        if: always()
        working-directory: backend
        run: tail -n 100 server.log || true
